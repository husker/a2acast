    - main [ref=f3e58]:
      - generic [ref=f3e59]: OpenAI
      - article [ref=f3e60]:
        - generic [ref=f3e64]:
          - generic [ref=f3e65]: Select language
          - combobox "Select language" [disabled] [ref=f3e68]:
            - option "…" [selected]
        - generic [ref=f3e73]:
          - paragraph [ref=f3e75]: "Effective: October 29, 2025"
          - heading "Usage policies" [level=1] [ref=f3e76]
        - generic [ref=f3e78]:
          - paragraph [ref=f3e80]: We aim for our tools to be used safely and responsibly, while maximizing your control over how you use them. In building our Usage Policies, we keep a few important things in mind.
          - paragraph [ref=f3e82]:
            - generic [ref=f3e83]: We empower users to innovate with AI
            - text: . We build AI products that maximize helpfulness and freedom, while ensuring safety. Usage Policies are just one way we set clear expectations for the use of our products within a broader safety ecosystem that sets responsible guardrails across our services. You can
            - link "learn more" [ref=f3e84] [cursor=pointer]:
              - /url: /safety/how-we-think-about-safety-alignment/
            - text: about our safety approach and
            - link "our commitment to" [ref=f3e85] [cursor=pointer]:
              - /url: /index/introducing-the-model-spec/
            - text: customizability, transparency, and intellectual freedom to explore, debate, and create with AI.
          - paragraph [ref=f3e87]:
            - generic [ref=f3e88]: Responsible use is a shared priority
            - text: . We assume the very best of our users. Our
            - link "terms and policies" [ref=f3e89] [cursor=pointer]:
              - /url: /policies/
            - text: —including these Usage Policies—set a reasonable bar for acceptable use. Our rules are no substitute for legal requirements, professional duties, or ethical obligations that should influence how people use AI. We hold people accountable for inappropriate use of our services, and breaking or circumventing our rules and safeguards may mean you lose access to our systems or experience other penalties.
          - paragraph [ref=f3e91]:
            - generic [ref=f3e92]: We build with safety first
            - text: . We
            - link "monitor and enforce" [ref=f3e93] [cursor=pointer]:
              - /url: /transparency-and-content-moderation/
            - text: policies with privacy safeguards in place and clear review processes. We give developers practical
            - link "moderation tools⁠ (opens in a new window)" [ref=f3e94] [cursor=pointer]:
              - /url: https://platform.openai.com/docs/guides/moderation
              - text: moderation tools⁠
              - generic [ref=f3e95]: (opens in a new window)
            - text: and guidance so they can support their end users. We
            - link "publish" [ref=f3e96] [cursor=pointer]:
              - /url: /safety/
            - text: what our systems can and can’t do, share
            - link "research" [ref=f3e97] [cursor=pointer]:
              - /url: /research/index/
            - text: and
            - link "updates" [ref=f3e98] [cursor=pointer]:
              - /url: /news/
            - text: ", and provide a simple way to"
            - link "report misuse" [ref=f3e99] [cursor=pointer]:
              - /url: /form/report-content/
            - text: .
          - paragraph [ref=f3e101]:
            - generic [ref=f3e102]: We update as we learn
            - text: . People are using our systems in new ways every day, and we update our rules to ensure they are not overly restrictive or to better protect our users. We reserve all rights to withhold access where we reasonably believe it necessary to protect our service or users or anyone else. You can
            - link "appeal⁠" [ref=f3e103] [cursor=pointer]:
              - /url: https://openai.com/transparency-and-content-moderation/#:~:text=determining%20enforcement%20actions.-,Appeals%20process,-If%20we%20take
            - text: if you think we have made a mistake enforcing policy, and we will work to make things right. If you’d like to keep up with Usage Policies updates,
            - link "complete this form" [ref=f3e104] [cursor=pointer]:
              - /url: /form/usage-policy-update/
            - text: .
          - paragraph [ref=f3e106]:
            - generic [ref=f3e107]: "Your use of OpenAI services must follow these Usage Policies:"
          - list [ref=f3e109]:
            - listitem [ref=f3e110]:
              - generic [ref=f3e111]: Protect people
              - text: ". Everyone has a right to safety and security. So you cannot use our services for:"
              - list [ref=f3e112]:
                - listitem [ref=f3e113]: threats, intimidation, harassment, or defamation
                - listitem [ref=f3e114]: suicide, self-harm, or disordered eating promotion or facilitation
                - listitem [ref=f3e115]: sexual violence or non-consensual intimate content
                - listitem [ref=f3e116]: terrorism or violence, including hate-based violence
                - listitem [ref=f3e117]: weapons development, procurement, or use, including conventional weapons or CBRNE
                - listitem [ref=f3e118]: illicit activities, goods, or services
                - listitem [ref=f3e119]: destruction, compromise, or breach of another’s system or property, including malicious or abusive cyber activity or attempts to infringe on intellectual property rights of others
                - listitem [ref=f3e120]: real money gambling
                - listitem [ref=f3e121]: provision of tailored advice that requires a license, such as legal or medical advice, without appropriate involvement by a licensed professional
                - listitem [ref=f3e122]: unsolicited safety testing
                - listitem [ref=f3e123]: circumventing our safeguards
                - listitem [ref=f3e124]: national security or intelligence purposes without our review and approval
            - listitem [ref=f3e125]:
              - generic [ref=f3e126]: Respect privacy
              - text: ". People are entitled to privacy. So, we don’t allow attempts to compromise the privacy of others, including to aggregate, monitor, profile, or distribute individuals’ private or sensitive information without their authorization. And, you may never use our services for:"
              - list [ref=f3e127]:
                - listitem [ref=f3e128]: facial recognition databases without data subject consent
                - listitem [ref=f3e129]: real-time remote biometric identification in public spaces
                - listitem [ref=f3e130]: use of someone’s likeness, including their photorealistic image or voice, without their consent in ways that could confuse authenticity
                - listitem [ref=f3e131]: evaluation or classification of individuals based on their social behavior, personal traits, or biometric data (including social scoring, profiling, or inferring sensitive attributes)
                - listitem [ref=f3e132]: inference regarding an individual’s emotions in the workplace and educational settings, except when necessary for medical or safety reasons
                - listitem [ref=f3e133]: assessment or prediction of the risk of an individual committing a criminal offense based solely on their personal traits or on profiling
            - listitem [ref=f3e134]:
              - generic [ref=f3e135]: Keep minors safe
              - text: .Children and teens deserve special protection. Our services are designed to prevent harm and support their well-being, and must never be used to exploit, endanger, or sexualize anyone under 18 years old.
              - link "We report" [ref=f3e137] [cursor=pointer]:
                - /url: /index/combating-online-child-sexual-exploitation-abuse/
              - text: "apparent child sexual abuse material and child endangerment to the National Center for Missing and Exploited Children. We prohibit use of our services for:"
              - list [ref=f3e138]:
                - listitem [ref=f3e139]: child sexual abuse material (CSAM), whether or not any portion is AI generated
                - listitem [ref=f3e140]: grooming of minors
                - listitem [ref=f3e141]: exposing minors to age-inappropriate content, such as graphic self-harm, sexual, or violent content
                - listitem [ref=f3e142]: promoting unhealthy dieting or exercise behavior to minors
                - listitem [ref=f3e143]: shaming or otherwise stigmatizing the body type or appearance of minors
                - listitem [ref=f3e144]: dangerous challenges for minors
                - listitem [ref=f3e145]: underaged sexual or violent roleplay
                - listitem [ref=f3e146]: underaged access to age-restricted goods or activities
            - listitem [ref=f3e147]:
              - generic [ref=f3e148]: Empower people
              - text: ". People should be able to make decisions about their lives and their communities. So we don’t allow our services to be used to manipulate or deceive people, to interfere with their exercise of human rights, to exploit people’s vulnerabilities, or to interfere with their ability to get an education or access critical services, including any use for:"
              - list [ref=f3e149]:
                - listitem [ref=f3e150]: academic dishonesty
                - listitem [ref=f3e151]: deceit, fraud, scams, spam, or impersonation
                - listitem [ref=f3e152]: political campaigning, lobbying, foreign or domestic election interference, or demobilization activities
                - listitem [ref=f3e153]:
                  - text: automation of high-stakes decisions in sensitive areas without human review
                  - list [ref=f3e154]:
                    - listitem [ref=f3e155]: critical infrastructure
                    - listitem [ref=f3e156]: education
                    - listitem [ref=f3e157]: housing
                    - listitem [ref=f3e158]: employment
                    - listitem [ref=f3e159]: financial activities and credit
                    - listitem [ref=f3e160]: insurance
                    - listitem [ref=f3e161]: legal
                    - listitem [ref=f3e162]: medical
                    - listitem [ref=f3e163]: essential government services
                    - listitem [ref=f3e164]: product safety components
                    - listitem [ref=f3e165]: national security
                    - listitem [ref=f3e166]: migration
                    - listitem [ref=f3e167]: law enforcement
          - heading "Changelog" [level=2] [ref=f3e171]
          - list [ref=f3e173]:
            - listitem [ref=f3e174]: "2025-10-29: We've updated our Usage Policies to reflect a universal set of policies across OpenAI products and services."
            - listitem [ref=f3e175]: "2025-01-29: We've updated our Universal Policies to clarify prohibitions under applicable laws."
            - listitem [ref=f3e176]: "2024-01-10: We've updated our Usage Policies to be clearer and provide more service-specific guidance."
            - listitem [ref=f3e177]: "2023-02-15: We’ve combined our use case and content policies into a single set of usage policies, and have provided more specific guidance on what activity we disallow in industries we’ve considered high risk."
            - listitem [ref=f3e178]: "2022-11-09: We no longer require you to register your applications with OpenAI. Instead, we'll be using a combination of automated and manual methods to monitor for policy violations."
            - listitem [ref=f3e179]: "2022-10-25: Updated App Review process (devs no longer need to wait for approval after submitting as long as they comply with our policies). Moved to an outcomes-based approach and updated Safety Best Practices."
            - listitem [ref=f3e180]: "2022-06-07: Refactored into categories of applications and corresponding requirements."
            - listitem [ref=f3e181]: "2022-03-09: Refactored into “App Review”."
            - listitem [ref=f3e182]: "2022-01-19: Simplified copywriting and article writing/editing guidelines."
            - listitem [ref=f3e183]: "2021-11-15: Addition of “Content guidelines” section; changes to bullets on almost always approved uses and disallowed uses; renaming document from “Use case guidelines” to “Usage guidelines”."
            - listitem [ref=f3e184]: "2021-08-04: Updated with information related to code generation."
            - listitem [ref=f3e185]: "2021-03-12: Added detailed case-by-case requirements; small copy and ordering edits."
            - listitem [ref=f3e186]: "2021-02-26: Clarified the impermissibility of Tweet and Instagram generators."
